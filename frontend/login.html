<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 - Handyprint 设计工具</title>
<style>
  :root { --ink:#1d1d1f; --muted:#6e6e73; --line:#e8e8ed; --accent:#0071e3; --danger:#d70015; }
  body { font: 14px/1.55 -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; -webkit-font-smoothing: antialiased; margin: 0; background: #f5f5f7; color: var(--ink); }
  header.topnav { height: 52px; padding: 0 22px; display: flex; align-items: center; background: rgba(255,255,255,0.78); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid rgba(0,0,0,0.07); color: var(--ink); }
  header.topnav .brandmark { font-weight: 700; letter-spacing: -0.2px; font-size: 15px; }
  .card { max-width: 360px; margin: 90px auto; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 28px; box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.04); }
  h2 { margin: 0 0 14px; font-size: 19px; letter-spacing: -0.3px; }
  label { display: block; margin: 12px 0 5px; font-weight: 500; font-size: 12.5px; color: #3a3a3c; }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d2d2d7; border-radius: 10px; font: inherit; transition: border-color .15s ease, box-shadow .15s ease; }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3.5px rgba(0,113,227,0.18); }
  button { margin-top: 18px; padding: 11px 16px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; width: 100%; transition: filter .15s ease, transform .1s ease; }
  button:hover { filter: brightness(1.06); }
  button:active { transform: scale(0.985); }
  button:disabled { background: #c7c7cc; cursor: not-allowed; }
  .err { color: var(--danger); margin-top: 10px; min-height: 1.2em; }
  .muted { color: var(--muted); font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
<header class="topnav"><span class="brandmark">Handyprint</span></header>
<div class="card">
  <h2>登录</h2>
  <label>用户名</label>
  <input id="username" autocomplete="username" autofocus>
  <label>密码</label>
  <input id="password" type="password" autocomplete="current-password">
  <button id="loginBtn">登录</button>
  <div class="err" id="err"></div>
  <div class="muted">没有账号？请联系管理员为你开通（白名单制）。</div>
</div>
<script>
const $ = id => document.getElementById(id);
// already logged in, or auth is off: this page has no job, go home
fetch("/whoami").then(r => r.json()).then(w => { if (!w.auth || w.user) location.href = "/"; }).catch(() => {});
async function doLogin() {
  $("err").textContent = "";
  $("loginBtn").disabled = true;
  try {
    const r = await fetch("/login", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("username").value, password: $("password").value }) });
    const j = await r.json();
    if (r.ok && j.ok) { location.href = "/"; return; }
    $("err").textContent = j.error || "登录失败";
  } catch (e) {
    $("err").textContent = "网络错误：" + e;
  }
  $("loginBtn").disabled = false;
}
$("loginBtn").onclick = doLogin;
["username", "password"].forEach(id =>
  $(id).addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); }));
</script>
</body>
</html>
