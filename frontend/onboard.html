<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand Onboarding</title>
<style>
  :root { --ink:#1a1a1a; --muted:#6b7280; --line:#e3e3e6; --nav:#23232a; --accent:#3b82f6; --ok:#2a6; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; background: #f6f6f7; color: var(--ink); }
  header.topnav { background: var(--nav); color: #fff; height: 52px; padding: 0 20px; display: flex; align-items: center; gap: 22px; }
  header.topnav .brandmark { font-weight: 700; letter-spacing: 0.3px; }
  header.topnav nav { display: flex; gap: 4px; }
  header.topnav nav a { color: #c7c7d1; text-decoration: none; font-weight: 600; font-size: 13px; padding: 6px 12px; border-radius: 6px; }
  header.topnav nav a:hover { background: #34343d; color: #fff; }
  header.topnav nav a.active { background: var(--accent); color: #fff; }
  main { max-width: 760px; margin: 0 auto; padding: 22px 20px; }
  .step { background: #fff; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 16px; padding: 16px 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
  .step.done { opacity: 0.6; }
  h3 { margin: 0 0 10px; font-size: 14px; }
  label { display: block; margin: 8px 0 3px; font-weight: 600; font-size: 12px; color: #444; }
  input, select { box-sizing: border-box; padding: 7px 9px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
  input[type=text] { width: 100%; }
  button { margin-top: 12px; padding: 9px 14px; border: 0; border-radius: 6px; background: var(--ok); color: #fff; font-weight: 600; cursor: pointer; }
  button:hover { filter: brightness(1.05); }
  button:disabled { background: #999; cursor: not-allowed; }
  .swatch { display: inline-block; width: 28px; height: 28px; border-radius: 4px; border: 1px solid #ccc; vertical-align: middle; margin-right: 8px; }
  .color-row { padding: 6px 0; border-bottom: 1px solid #f0f0f0; }
  .flag { color: #b8860b; font-weight: 600; }
  .err { color: #c0392b; font-weight: 600; margin-top: 8px; }
  .ok { color: #2a6; font-weight: 600; }
  .pending { color: #999; }
  .handoff { display: inline-block; margin-top: 10px; font-weight: 600; color: var(--accent); }
  pre { white-space: pre-wrap; background: #fafafa; padding: 8px; border-radius: 4px; }
</style>
</head>
<body>
<header class="topnav">
  <span class="brandmark">Handyprint</span>
  <nav>
    <a href="/">生成设计</a>
    <a href="/onboard" class="active" aria-current="page">录入品牌</a>
    <a href="/manage">品牌管理</a>
    <a href="/playbook">使用手册</a>
  </nav>
</header>
<main>
  <div class="step" id="s1">
    <h3>1. 上传品牌 VI 手册 PDF</h3>
    <input type="file" id="pdf" accept="application/pdf">
    <button id="uploadBtn">上传并自动定位规范页</button>
    <div id="s1err" class="err"></div>
  </div>

  <div class="step" id="s2" style="display:none">
    <h3>2. 确认规范页页码（从 1 开始数；不对就改）</h3>
    <label>颜色规范页（多页用逗号分隔）</label><input type="text" id="colorPages">
    <label>品牌名称页（多页用逗号分隔）</label><input type="text" id="namePages">
    <button id="extractBtn">提取（本地运行，免费，需要几秒钟）</button>
    <div id="s2err" class="err"></div>
    <div id="s2busy" class="pending" style="display:none">提取中（本地 OCR 识别）...</div>
  </div>

  <div class="step" id="s3" style="display:none">
    <h3>3. 核对品牌要素，然后保存</h3>
    <label>品牌 ID（英文/拼音，作为文件夹和档案名）</label><input type="text" id="brandId">
    <label>品牌名（中文）</label><input type="text" id="brandCn">
    <label>品牌名（英文）</label><input type="text" id="brandEn">
    <div id="colors"></div>
    <label>Logo 文件</label><input type="file" id="logo" accept="image/*">
    <button id="saveBtn">校验并保存</button>
    <div id="s3err" class="err"></div>
    <div id="s3ok" class="ok"></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let draftId = null, locks = [];

async function jpost(url, body, isForm) {
  const opts = { method: "POST", body: isForm ? body : JSON.stringify(body) };
  const r = await fetch(url, opts);
  return { ok: r.ok, data: await r.json() };
}

$("uploadBtn").onclick = async () => {
  $("s1err").textContent = "";
  const f = $("pdf").files[0];
  if (!f) { $("s1err").textContent = "请先选择一个 PDF 文件。"; return; }
  $("uploadBtn").disabled = true;
  const fd = new FormData(); fd.append("pdf", f, f.name);
  const { ok, data } = await jpost("/onboard/upload", fd, true);
  $("uploadBtn").disabled = false;
  if (!ok) { $("s1err").textContent = data.error || "上传失败"; return; }
  draftId = data.draft_id;
  $("colorPages").value = (data.suggestions.color || []).join(",");
  $("namePages").value = (data.suggestions.brand_name || []).join(",");
  $("s1").classList.add("done"); $("s2").style.display = "block";
};

function pages(id) { return $(id).value.split(",").map(s => parseInt(s.trim(), 10)).filter(n => n >= 1); }

$("extractBtn").onclick = async () => {
  $("s2err").textContent = ""; $("s2busy").style.display = "block"; $("extractBtn").disabled = true;
  const { ok, data } = await jpost(`/onboard/${draftId}/extract`,
    { color: pages("colorPages"), name: pages("namePages") });
  $("s2busy").style.display = "none"; $("extractBtn").disabled = false;
  if (!ok) { $("s2err").textContent = data.error || "提取失败"; return; }
  if (data.block) { $("s2err").textContent = data.block; return; }  // zero colors -> stay on step 2
  locks = data.locks;
  renderColors();
  if (data.names && data.names.cn_candidates && data.names.cn_candidates.length)
    $("brandCn").value = data.names.cn_candidates[0];
  if (data.names && data.names.en_candidates && data.names.en_candidates.length)
    $("brandEn").value = data.names.en_candidates[0];
  $("s2").classList.add("done"); $("s3").style.display = "block";
};

function renderColors() {
  $("colors").innerHTML = "<label>颜色（必须指定且只指定一个 primary 主色；其余选 secondary/accent/background/text；有标记的需要确认）</label>" +
    locks.map((c, i) => `<div class="color-row">
      <span class="swatch" style="background:${c.hex}"></span><code>${c.hex}</code>
      <select data-role="${i}">
        <option value="">选择角色...</option><option value="primary">primary</option>
        <option value="secondary">secondary</option><option value="accent">accent</option>
        <option value="background">background</option><option value="text">text</option>
      </select>
      ${c.needs_review ? `<span class="flag">needs_review</span>
        <select data-ack="${i}"><option value="">如何处理...</option>
        <option value="confirm">确认无误</option><option value="edit">需要修改</option>
        <option value="keep-flagged">保留标记</option></select>` : ""}
    </div>`).join("");
}

$("saveBtn").onclick = async () => {
  $("s3err").textContent = ""; $("s3ok").textContent = "";
  const verified = {
    brand: $("brandId").value.trim(), brand_cn: $("brandCn").value.trim(),
    brand_en: $("brandEn").value.trim(), verified_by: "web",
    colors: locks.map((c, i) => ({
      hex: c.hex, rgb: c.rgb, name_cn: "", name_en: "",
      role: (document.querySelector(`[data-role="${i}"]`) || {}).value || null,
      needs_review: c.needs_review,
      _ack: (document.querySelector(`[data-ack="${i}"]`) || {}).value || null,
    })),
  };
  const logoFile = $("logo").files[0];
  if (!logoFile) { $("s3err").textContent = "必须上传 Logo 文件。"; return; }
  $("saveBtn").disabled = true;
  const fd = new FormData();
  fd.append("verified", JSON.stringify(verified));
  fd.append("logo", logoFile, logoFile.name);
  const { ok, data } = await jpost(`/onboard/${draftId}/save`, fd, true);
  $("saveBtn").disabled = false;
  if (!ok) { $("s3err").textContent = data.error || "保存失败"; return; }
  // feature 010: handoff - render the saved message PLUS a link to the live-runner with this brand
  // preselected (innerHTML so the <a> renders as a link, not literal text).
  const b = data.brand;
  $("s3ok").innerHTML = `已保存 ${b}。${data.message} ` +
    `<a class="handoff" href="/?brand=${encodeURIComponent(b)}">用这个品牌去生成设计</a>`;
  $("s3").classList.add("done");
};
</script>
</body>
</html>
