<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Runner (single sign)</title>
<style>
  :root { --ink:#1a1a1a; --muted:#6b7280; --line:#e3e3e6; --nav:#23232a; --accent:#3b82f6; --paid:#c0392b; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; background: #f6f6f7; color: var(--ink); }
  header.topnav { background: var(--nav); color: #fff; height: 52px; padding: 0 20px; display: flex; align-items: center; gap: 22px; }
  header.topnav .brandmark { font-weight: 700; letter-spacing: 0.3px; }
  header.topnav nav { display: flex; gap: 4px; }
  header.topnav nav a { color: #c7c7d1; text-decoration: none; font-weight: 600; font-size: 13px; padding: 6px 12px; border-radius: 6px; }
  header.topnav nav a:hover { background: #34343d; color: #fff; }
  header.topnav nav a.active { background: var(--accent); color: #fff; }
  header.topnav .userchip { margin-left: auto; font-size: 12px; color: #c7c7d1; }
  header.topnav .userchip a { color: #fff; margin-left: 8px; cursor: pointer; text-decoration: underline; }
  main { display: grid; grid-template-columns: 380px 1fr; gap: 0; height: calc(100vh - 52px); }
  .panel { padding: 18px 20px; overflow-y: auto; }
  .form { background: #fff; border-right: 1px solid #ddd; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 14px; padding: 6px 12px 12px; }
  legend { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); padding: 0 4px; }
  label { display: block; margin: 10px 0 3px; font-weight: 600; font-size: 12px; color: #444; }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  .slider-val { font-weight: 600; color: #2a6; }
  button { margin-top: 14px; padding: 10px 14px; border: 0; border-radius: 6px; background: var(--paid); color: #fff; font-weight: 600; cursor: pointer; width: 100%; }
  button:hover { filter: brightness(1.05); }
  button:disabled { background: #999; cursor: not-allowed; }
  .stage { background: #fff; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
  .stage h3 { margin: 0; padding: 10px 14px; border-bottom: 1px solid #eee; font-size: 13px; }
  .stage .body { padding: 12px 14px; }
  .pending { color: #999; }
  .note { color: #b8860b; font-style: italic; }
  pre { white-space: pre-wrap; word-break: break-word; background: #fafafa; padding: 10px; border-radius: 4px; max-height: 320px; overflow: auto; margin: 0; }
  img { max-width: 100%; border-radius: 6px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .ok { background: #2a6; } .wait { background: #ccc; }
</style>
</head>
<body>
<header class="topnav">
  <span class="brandmark">Handyprint</span>
  <nav>
    <a href="/" class="active" aria-current="page">生成设计</a>
    <a href="/onboard">录入品牌</a>
    <a href="/manage">品牌管理</a>
    <a href="/playbook">使用手册</a>
  </nav>
  <span class="userchip" id="userchip" hidden><span id="uname"></span><a id="logoutLink">退出</a></span>
</header>
<main>
  <section class="panel form">
    <fieldset><legend>品牌与产出物</legend>
      <label>品牌 Brand</label>
      <select id="brand"></select>
      <div id="brandstatus" class="note"></div>
      <label>产出物类型（可自由中文描述，例如：朋友圈海报、门店物料）</label>
      <input id="asset_type" value="手举牌 hand-held event sign">
      <label>渲染风格</label>
      <select id="render_style"><option value="flat vector">扁平插画 flat vector</option><option value="photographic">摄影质感 photographic</option></select>
      <label>尺寸（宽、高分开填，单位可选 cm 或 px）</label>
      <div class="row">
        <div><label>宽 W</label><input id="size_w" type="number" min="0" step="any" value="60"></div>
        <div><label>高 H</label><input id="size_h" type="number" min="0" step="any" value="40"></div>
        <div><label>单位</label><select id="size_unit"><option value="cm">cm 厘米</option><option value="px">px 像素</option></select></div>
      </div>
      <div class="note">按此比例生成草稿图（约 150 万像素），不是精确像素稿或印刷分辨率文件；由设计师收尾。</div>
    </fieldset>

    <fieldset><legend>参考图</legend>
      <label>风格参考图（必选，上传文件）：这张图决定整体感觉</label>
      <input type="file" id="reference_image">
      <label>产品实拍图（可选，最多 6 张）：设计中必须出现的真实产品照片</label>
      <input type="file" id="product_images" multiple>
      <label>参考图的用法</label>
      <select id="reference_relationship">
        <option value="extend">延续：保持这张图的外观和基因，只换文案</option>
        <option value="match style">同风格：同一视觉语言，全新排版</option>
        <option value="mood">仅氛围：只作调性参考，构图自由</option>
      </select>
    </fieldset>

    <fieldset><legend>语气与氛围</legend>
      <div class="row">
        <div><label>正式程度 <span class="slider-val" id="fv">2</span></label><input type="range" id="formality" min="0" max="10" value="2"></div>
        <div><label>活泼程度 <span class="slider-val" id="pv">8</span></label><input type="range" id="playfulness" min="0" max="10" value="8"></div>
      </div>
      <label>Logo 处理</label>
      <select id="logo_treatment"><option value="omit">不出现</option><option value="subtle">低调出现</option><option value="faithful">忠实呈现</option></select>
      <label>品牌规范强度</label>
      <select id="brand_strictness"><option value="expressive departure">大胆发挥</option><option value="brand + accents">品牌色为主</option><option value="strict VI">严格遵守 VI</option></select>
    </fieldset>

    <fieldset><legend>场景</legend>
      <label>活动或主题（不会出现在画面文字里）</label>
      <input id="occasion" value="防范非法金融宣传">
      <label>用途（可自由中文描述，例如：朋友圈推广、活动现场手举牌）</label>
      <input id="usage_context" value="held for photos / posed with">
    </fieldset>

    <fieldset><legend>元素与文案</legend>
      <label>必须出现的元素（每行一个，按原文执行）</label>
      <textarea id="mandatory_elements" rows="2">分别画叉</textarea>
      <label>禁止出现的元素（每行一个）</label>
      <textarea id="forbidden_elements" rows="1"></textarea>
      <label>画面上的文字（每行一条，逐字呈现：画面上只会出现这些字）</label>
      <textarea id="messages" rows="2">守住钱袋子
护好幸福家</textarea>
      <label>设计要求（可选；必须遵守的指令，例如"产品要写实，背景卡通"）</label>
      <textarea id="design_notes" rows="2"></textarea>
    </fieldset>

    <button id="run">开始（免费预览：先推导方案，确认后才收费）</button>
    <div id="formNote" class="note"></div>
  </section>

  <section class="panel">
    <div id="recentruns"></div>
    <div id="attempts"></div>
    <div class="stage"><h3><span class="dot wait" id="d_brief"></span>1. 需求（系统收到的内容）</h3><div class="body" id="brief"><span class="pending">等待运行...</span></div></div>
    <div class="stage"><h3><span class="dot wait" id="d_register"></span>2. 风格判定 Register</h3><div class="body" id="register"><span class="pending">尚未开始</span></div></div>
    <div class="stage"><h3><span class="dot wait" id="d_prompt"></span>3. 生成指令 Prompt</h3><div class="body" id="prompt"><span class="pending">尚未开始</span></div></div>
    <div id="pregate"></div>
    <div class="stage"><h3><span class="dot wait" id="d_image"></span>4. 生成的画面</h3><div class="body" id="image"><span class="pending">尚未生成（确认方案后才会出现）</span></div></div>
    <div id="gate"></div>
    <div id="exportstage"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
for (const [s, v] of [["formality","fv"],["playfulness","pv"]]) {
  $(s).addEventListener("input", () => $(v).textContent = $(s).value);
}
let currentRun = null, poller = null, attempts = [];

// --- 017 (US3): the gate panel's CLOSED server vocabulary rendered in Chinese. Server
// payloads and submitted values are UNCHANGED; unmapped strings fall back to English
// (honest: never guess a translation). Keys must track the server vocabulary; check7
// drift-guards the lane option labels. ---
const ZH = {
  "marketing piece": "营销物料", "hand-held event prop": "手举活动道具", "formal piece": "正式物料",
  "flat vector": "扁平插画", "photographic": "摄影质感",
  "extend the reference family": "延续参考图风格", "match its style": "同风格新排版", "mood only": "仅作氛围参考",
  "60x40cm landscape": "60x40cm 横版", "40x60cm portrait": "40x60cm 竖版", "square": "正方形",
  "keep 1536x1024": "保持 1536x1024", "set directly": "自行设定",
  "job register": "任务类型", "output size": "输出尺寸", "reference relationship": "参考图用法",
  "render mode": "渲染方式", "style intensity": "风格强度",
};
function zh(s) {
  s = String(s ?? "");
  if (ZH[s]) return ZH[s];
  for (const k in ZH) if (s.startsWith(k)) return ZH[k] + s.slice(k.length);
  return s;   // English fallback: unmapped vocabulary stays honest
}

async function jf(url, opts) {
  // 021: the ONE fetch home for API calls; a dead/absent session bounces to the login page
  const r = await fetch(url, opts);
  if (r.status === 401) { location.href = "/login"; throw new Error("login required"); }
  return r;
}

let brandDetail = {};   // 019: per-brand asset status for the form's honesty line
function renderBrandStatus() {
  const d = brandDetail[$("brand").value];
  $("brandstatus").textContent = !d ? "" :
    (d.logo_resolved ? "✓ 素材齐全" : "✗ 缺少 logo 素材：出图会被明确拒绝（去「品牌管理」补齐或删除该品牌）");
}
async function loadBrands() {
  const r = await jf("/brands"); const j = await r.json();
  $("brand").innerHTML = j.brands.map(b => `<option>${b}</option>`).join("");
  try {   // best-effort: the status line never blocks the form
    const rd = await jf("/brands/detail"); const jd = await rd.json();
    (jd.brands || []).forEach(b => brandDetail[b.brand] = b);
  } catch (e) {}
  renderBrandStatus();
  $("brand").addEventListener("change", renderBrandStatus);
  $("run").textContent = `开始（免费预览；确认方案后才收费，约 $${j.per_run_cost_usd.toFixed(2)}）`;
  // feature 010: preselect the brand handed off from onboarding (/?brand=<id>); graceful if absent/unknown
  const want = new URLSearchParams(location.search).get("brand");
  if (want && j.brands.includes(want)) $("brand").value = want;
}
function lines(id) { return $(id).value.split("\n").map(s => s.trim()).filter(Boolean); }
function formState() {
  return {
    // 022: the canonical brief string is COMPOSED from the three size controls; the
    // untouched defaults (60/40/cm) compose exactly "60x40cm", the pre-022 literal (the
    // byte-identity pin) — every downstream consumer of format_size is unchanged.
    brand: $("brand").value, asset_type: $("asset_type").value, render_style: $("render_style").value,
    format_size: $("size_w").value + "x" + $("size_h").value + $("size_unit").value,
    reference_relationship: $("reference_relationship").value,
    vibe: { formality: +$("formality").value, playfulness: +$("playfulness").value },
    logo_treatment: $("logo_treatment").value, brand_strictness: $("brand_strictness").value,
    occasion: $("occasion").value, usage_context: $("usage_context").value,
    mandatory_elements: lines("mandatory_elements"), forbidden_elements: lines("forbidden_elements"),
    messages: lines("messages"),
  };
}
function renderStage(key, st) {
  const dot = $("d_" + key), body = $(key);
  dot.className = "dot " + (st.present ? "ok" : "wait");
  if (key === "image") {
    body.innerHTML = st.present ? `<img src="/run/${currentRun}/image?t=${Date.now()}">`
      : `<span class="pending">生成中...</span>` + (st.note ? `<div class="note">${st.note}</div>` : "");
    return;
  }
  if (!st.present) { body.innerHTML = `<span class="pending">尚未开始</span>` + (st.note ? `<div class="note">${st.note}</div>` : ""); return; }
  const c = st.content;
  body.innerHTML = `<pre>${typeof c === "string" ? c : JSON.stringify(c, null, 2)}</pre>`;
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function renderPreGate(g, cost) {
  // 015: the pre-spend confirm panel. Zero assumption rows = a plain summary + confirm
  // (never manufactured questions); the derived plan itself is stages 2-3 above.
  if (!g || !g.content || g.content.state === "done") { $("pregate").innerHTML = ""; return; }
  const c = g.content;
  if (c.state === "confirmed" || c.state === "generating") {
    $("pregate").innerHTML = `<div class="stage"><h3>3b. 方案已确认</h3><div class="body"><span class="pending">正在生成画面（已收费）...</span></div></div>`;
    return;
  }
  if (c.state !== "awaiting_confirmation") { $("pregate").innerHTML = ""; return; }
  const rows = (c.assumptions || []).map((a, i) =>
    `<div style="margin:6px 0;padding:6px;border:1px solid #b84;border-radius:4px">
       <b>${esc(zh(a.dimension))}</b>：系统替你假设了 <i>${esc(zh(a.assumed_value))}</i>
       <div class="note">原因：<code>${esc(a.cause.input)}</code> ${esc(a.cause.reason)}${a.cause.value ? `（你填的是："${esc(a.cause.value)}"）` : ""}</div>
       <div id="assumpctl_${i}">${renderAssumptionControl(a, i)}</div>
     </div>`).join("");
  const applied = (c.answers_applied || []).length
    ? `<div class="note">已应用的修改：${c.answers_applied.map(x => esc(zh(x.chosen_label || x.assumption_id))).join("，")}</div>` : "";
  $("pregate").innerHTML = `<div class="stage"><h3>3b. 付费前确认</h3><div class="body">
    ${rows.length ? `<div>系统替你做了 ${rows.length} 项假设，请确认或修改：</div>${rows}`
                  : `<div>无需任何假设：每个字段都明确且被识别。请查看上方的风格判定（2）和生成指令（3）。</div>`}
    ${applied}
    ${c.state_note ? `<div class="note">${esc(c.state_note)}</div>` : ""}
    <button id="confirm" style="background:#2a6">确认并生成（收费，约 $${(cost ?? 0.08).toFixed(2)}）</button>
    <div class="note">确认之前不花一分钱；直接离开的话，这份草案会留在服务器上，不产生费用。</div>
    <div id="pregateNote" class="note"></div></div></div>`;
  $("confirm").onclick = confirmRun;
  (c.assumptions || []).forEach((a, i) => {
    const btn = $(`a_${i}_apply`);
    if (!btn) return;
    btn.onclick = () => {
      if ($(`a_${i}_f`)) {  // the magnitude row carries two numeric fields
        applyAnswer(a, a.options[0].label,
                    { formality: +$(`a_${i}_f`).value, playfulness: +$(`a_${i}_p`).value });
      } else {
        applyAnswer(a, $(`a_${i}_sel`).value);
      }
    };
  });
}
function renderAssumptionControl(a, i) {
  // 015 US2: constrained controls ONLY (a pick of the shipped options, or bounded numbers
  // for the magnitude row); never a free-text retype loop (clarification Q1).
  const opts = a.options || [];
  if (!opts.length) return "";
  const isSlider = opts.length === 1 && typeof opts[0].writes.value === "object";
  if (isSlider) {
    return `<label>自行设定（0-10）：</label>
      正式程度 <input type="number" id="a_${i}_f" min="0" max="10" value="5" style="width:4.5em">
      活泼程度 <input type="number" id="a_${i}_p" min="0" max="10" value="7" style="width:4.5em">
      <button id="a_${i}_apply" style="width:auto;background:#777">应用（免费，重新推导）</button>`;
  }
  return `<select id="a_${i}_sel" style="width:auto">${opts.map(o => `<option value="${esc(o.label)}">${esc(zh(o.label))}</option>`).join("")}</select>
    <button id="a_${i}_apply" style="width:auto;background:#777">应用（免费，重新推导）</button>`;
}
async function applyAnswer(a, label, value) {
  const body = { assumption_id: a.id, label };
  if (value) body.value = value;
  const r = await jf(`/run/${currentRun}/answer`, { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) {  // fail loud; the previous derivation stays (US2 scenario 3)
    $("pregateNote").textContent = j.error || "应用失败"; return;
  }
  $("pregateNote").textContent = "已应用；正在免费重新推导...";
  if (poller) clearInterval(poller);
  poller = setInterval(poll, 1000); poll();
}
async function confirmRun() {
  const r = await jf(`/run/${currentRun}/confirm`, { method: "POST" });
  const j = await r.json();
  if (!r.ok) { $("pregateNote").textContent = j.error || "确认失败"; return; }
  $("run").disabled = true;
  if (poller) clearInterval(poller);
  poller = setInterval(poll, 1000); poll();
}
async function poll() {
  if (!currentRun) return;
  const r = await jf(`/run/${currentRun}/stages`); const v = await r.json();
  ["brief","register","prompt","image"].forEach(k => renderStage(k, v[k]));
  renderPreGate(v.gate, v.per_run_cost_usd);
  renderExport(v);  // 016: the layered-export stage (opt-in button / progress / download)
  if (v.error) {  // the conductor failed loud: surface it instead of hanging silently at 'brief'
    clearInterval(poller); poller = null; $("run").disabled = false;
    $("formNote").textContent = "运行失败：" + v.error.split("\n").pop();
    return;
  }
  // 016: keep polling while an export is LIVE (the worker also holds inflight); a stale
  // exporting state (dead worker) must not keep the poller spinning forever
  const exporting = v.export && v.export.present
    && v.export.content.state === "exporting" && !v.export.content.stale;
  if ((v.image.present || (!v.inflight)) && !exporting) {
    clearInterval(poller); poller = null; $("run").disabled = false;
    // re-render the taste panel only when absent, so an Approve verdict survives the
    // poller stopping again after an export finishes
    if (v.image.present && !$("gate").innerHTML) showGate();
  }
}
async function startRun(style_notes) {
  const refFile = $("reference_image").files[0];
  if (!refFile) { $("formNote").textContent = "必须上传一张风格参考图（请选择文件）。"; return; }
  // 022 (FR-004): blank/zero/NaN width or height refuses LOUDLY before any launch,
  // never a silently defaulted size
  const sizeW = parseFloat($("size_w").value), sizeH = parseFloat($("size_h").value);
  if (!(sizeW > 0) || !(sizeH > 0)) { $("formNote").textContent = "请填写有效的宽和高（都要大于 0）。"; return; }
  // 013: product shots ride as DISTINCT parts product_1..N (the server parser is
  // last-wins per part name); client-side cap check mirrors the server's visible error.
  const prodFiles = Array.from($("product_images").files);
  if (prodFiles.length > 6) { $("formNote").textContent = "产品实拍图最多 6 张，请删掉一些再试。"; return; }
  // 012: binding notes = first-run design notes + any nudge, ";"-joined (the channel's
  // multi-note contract); a nudge APPENDS to the brief-time notes, never replaces them.
  const notes = [$("design_notes").value, style_notes || ""].map(s => s.trim()).filter(Boolean).join("; ");
  const form = Object.assign(formState(), notes ? { style_notes: notes } : {});
  $("formNote").textContent = ""; $("run").disabled = true; $("gate").innerHTML = ""; $("pregate").innerHTML = "";
  const fd = new FormData();
  fd.append("form", JSON.stringify(form));
  fd.append("reference", refFile, refFile.name);  // style_notes rides inside the `form` JSON above
  prodFiles.forEach((f, i) => fd.append("product_" + (i + 1), f, f.name));
  const r = await jf("/run", { method: "POST", body: fd });
  const j = await r.json();
  if (!r.ok) { $("formNote").textContent = j.error || "启动失败"; $("run").disabled = false; return; }
  setCurrentRun(j.run_id);
  if (!attempts.includes(j.run_id)) { attempts.push(j.run_id); renderAttempts(); }
  if (poller) clearInterval(poller);
  poller = setInterval(poll, 1000); poll();
}
function renderAttempts() {
  if (attempts.length < 2) { $("attempts").innerHTML = ""; return; }
  $("attempts").innerHTML = `<div class="stage"><div class="body">历次尝试（点击对比）：` +
    attempts.map((id, i) => `<button style="width:auto;margin:2px;background:${id === currentRun ? '#2a6' : '#777'}" onclick="viewAttempt('${id}')">${i + 1}${id === currentRun ? '（当前）' : ''}</button>`).join("") +
    `</div></div>`;
}
// --- 017 (US2): URL-hash resume + the recent-runs picker. The hash is the ONE piece of
// state that survives a refresh or dropped connection; runs themselves live on disk. ---
function setCurrentRun(id) {
  currentRun = id;
  history.replaceState(null, "", id ? "#" + id : location.pathname);
}
async function loadRuns() {
  try {
    const r = await jf("/runs"); const j = await r.json();
    const runs = (j.runs || []).slice(0, 12);
    if (!runs.length) { $("recentruns").innerHTML = ""; return; }
    $("recentruns").innerHTML = `<div class="stage"><h3>最近的运行</h3><div class="body">` +
      runs.map(x => `<div><a href="#${x.id}" onclick="openRun('${x.id}');return false">${x.id}</a>` +
        ` <span class="note">${esc(x.brand || "?")}${x.owner ? " · " + esc(x.owner) : ""}${x.image ? " · 有图" : ""}${x.export_state === "done" ? " · 已导出分层" : ""}</span></div>`).join("") +
      `<button type="button" id="runsrefresh" style="width:auto;margin-top:6px">刷新列表</button></div></div>`;
    $("runsrefresh").onclick = loadRuns;
  } catch (e) { /* the listing is best-effort; the form still works without it */ }
}
function openRun(id) { viewAttempt(id); }
function viewAttempt(id) {
  setCurrentRun(id); renderAttempts();
  $("gate").innerHTML = ""; $("exportstage").innerHTML = "";  // re-render for the switched run
  // restart the INTERVAL, not a one-shot poll: a finished run stops itself on the first
  // tick, but a mid-export run needs live polling or its progress/gate freeze forever
  if (poller) clearInterval(poller);
  poller = setInterval(poll, 1000); poll();
}
$("run").addEventListener("click", () => startRun(null));
// --- Feature 016: the layered-export stage. NEVER automatic: the button states the exact
// cost (from the FREE plan endpoint) and only an explicit click POSTs the spending route. ---
async function renderExport(v) {
  const el = $("exportstage");
  const gateDone = v.gate && v.gate.present && v.gate.content.state === "done";
  const ex = v.export;
  if ((!ex || !ex.present) && !gateDone) { el.innerHTML = ""; el.dataset.run = ""; return; }
  if (!ex || !ex.present) {
    // unexported, gate done: offer the opt-in button once per run (no refetch flicker)
    if (el.dataset.run === currentRun && $("exportbtn")) return;
    el.dataset.run = currentRun;
    el.innerHTML = `<div class="stage"><h3>6. 分层导出（可选，收费）</h3><div class="body">
      <div class="note">把画面拆成逐元素图层（每层一张透明 PNG + 一张白底 JPG 预览，打包成 zip）。gpt-image-2 没有原生图层输出，所以每一层都是一次额外的付费生成。</div>
      <button id="exportbtn" type="button" disabled>导出图层（正在核算费用...）</button>
      <div id="exportNote" class="note"></div></div></div>`;
    // the run this fetch belongs to: the continuation must never stamp another run's button
    const runAtFetch = currentRun;
    let r, j;
    try { r = await jf(`/run/${runAtFetch}/export/plan`); j = await r.json(); }
    catch (err) { r = { ok: false }; j = { error: String(err) }; }
    if (runAtFetch !== currentRun || !$("exportbtn")) return; // switched runs mid-fetch: stale result, drop it
    if (!r.ok) {
      // never latch a transient failure: the button becomes a FREE retry-the-check click
      $("exportbtn").textContent = "导出图层（费用核算失败；点击免费重试核算）";
      $("exportbtn").disabled = false;
      $("exportbtn").onclick = () => { el.dataset.run = ""; el.innerHTML = ""; poll(); };
      $("exportNote").textContent = j.error || "方案不可用";
      return;
    }
    $("exportbtn").textContent = `导出图层（收费，${j.calls} 张图约 $${j.cost_usd.toFixed(2)}）`;
    $("exportbtn").disabled = false;
    $("exportbtn").onclick = doExport;
    return;
  }
  const c = ex.content;
  el.dataset.run = currentRun;
  const rows = (c.layers || []).map(l =>
    `<div>${l.status === "ok" ? "✔" : "✖"} <b>${esc(l.id)}</b>${l.status === "ok" ? "" : `：无法抠图，${esc(l.note)}（原始图已留在 zip 里可手工处理）`}</div>`).join("");
  let head = "";
  if (c.state === "exporting" && c.stale) head = `<div class="note">导出中断（${esc(c.error || "任务进程未完成即退出")}）。可以放心重试：当前没有任务在跑。</div><button id="exportretry" type="button">重试导出（收费，${esc(c.cost_stated || "")}）</button>`;
  else if (c.state === "exporting") head = `<span class="pending">导出中（收费 ${esc(c.cost_stated || "")}，共 ${c.calls || "?"} 张图）...</span>`;
  if (c.state === "failed") head = `<div class="note">导出失败：${esc(c.error || "详见 export_error.txt")}</div><button id="exportretry" type="button">重试导出（收费，${esc(c.cost_stated || "")}）</button>`;
  const zip = c.zip_ready ? `<div><a href="/run/${currentRun}/layers.zip" download>下载 layers.zip</a></div>` : "";
  el.innerHTML = `<div class="stage"><h3>6. Layered export</h3><div class="body">${head}${rows}${zip}<div id="exportNote" class="note"></div></div></div>`;
  const retry = $("exportretry");
  if (retry) retry.onclick = doExport;
}
async function doExport() {
  const btn = $("exportbtn") || $("exportretry");
  if (btn) btn.disabled = true;
  let r, j;
  try { r = await jf(`/run/${currentRun}/export`, { method: "POST" }); j = await r.json(); }
  catch (err) { r = { ok: false }; j = { error: String(err) }; }
  if (!r.ok) {
    const note = $("exportNote");
    if (note) note.textContent = j.error || "导出被拒绝";
    if (btn) btn.disabled = false;
    return;
  }
  if (poller) clearInterval(poller);
  poller = setInterval(poll, 1000); poll();
}
function showGate() {
  $("gate").innerHTML = `<div class="stage"><h3>5. 你的判断（二选一）</h3><div class="body">
    <button id="approve" style="background:#2a6">满意（就用这张）</button>
    <label>调整：写一条必须遵守的修改意见，系统免费重新推导；新方案在它自己的确认页上收费（约 $0.08）</label>
    <textarea id="note" rows="2" placeholder="例如：钱袋子画大一点、更醒目"></textarea>
    <button id="nudge">按意见重新推导（免费预览）</button>
    <div id="gateNote" class="note"></div></div></div>`;
  $("approve").onclick = () => {
    $("gate").innerHTML = `<div class="stage"><div class="body">已定稿。<b>${currentRun}</b> 就是交付稿；之前的尝试仍保留在上方可对比。</div></div>`;
  };
  $("nudge").onclick = () => {
    const note = $("note").value.trim();
    if (!note) { $("gateNote").textContent = "请先写下修改意见，或直接点满意。"; return; }
    startRun(note);
  };
}
loadBrands();
loadRuns();
// 017: a #run_... hash reopens that run after a refresh/reconnect; NO hash = the pre-017
// startup path, byte-identical (an unknown id renders the honest empty stages + the picker)
if (location.hash.startsWith("#run_")) openRun(location.hash.slice(1));
</script>
<script>
// 021: the nav user chip; renders only when auth is on and a session is live (/whoami)
(async () => {
  try {
    const w = await (await fetch("/whoami")).json();
    if (!w.auth || !w.user) return;
    document.getElementById("uname").textContent = w.user + (w.role === "super" ? "（管理员）" : "");
    document.getElementById("userchip").hidden = false;
    document.getElementById("logoutLink").onclick = async () => {
      await fetch("/logout", { method: "POST" }); location.href = "/login";
    };
  } catch (e) { /* cosmetic: never break the page */ }
})();
</script>
